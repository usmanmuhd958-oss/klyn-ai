name: Core Phase 0 Verification

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core-phase0.yml"
  pull_request:
    paths:
      - "core/**"
      - ".github/workflows/core-phase0.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Normalize module dependencies
        run: go mod tidy

      - name: Run race-enabled test suite
        run: go test -v -race ./...

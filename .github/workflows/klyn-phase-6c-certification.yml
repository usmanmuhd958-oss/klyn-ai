name: KLYN Phase 6C Certification

on:
  pull_request:
    branches:
      - main
      - phase/6a-hermetic-tool-execution
    paths:
      - "packages/agent-core/**"
      - "packages/execution-runtime/**"
      - "packages/cognitive-engine/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - phase/6c-self-healing-context
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klyn-phase-6c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-6c-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Install backend workspace with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Agent core typecheck
        run: pnpm --filter @klyn/agent-core typecheck

      - name: Execution runtime typecheck
        run: pnpm --filter @klyn/execution-runtime typecheck

      - name: Cognitive engine typecheck
        run: pnpm --filter @klyn/cognitive-engine typecheck

      - name: Agent core build
        run: pnpm --filter @klyn/agent-core build

      - name: Execution runtime build
        run: pnpm --filter @klyn/execution-runtime build

      - name: Cognitive engine build
        run: pnpm --filter @klyn/cognitive-engine build

      - name: Agent core tests
        run: pnpm --filter @klyn/agent-core test

      - name: Execution runtime tests
        run: pnpm --filter @klyn/execution-runtime test

      - name: Cognitive engine tests
        run: pnpm --filter @klyn/cognitive-engine test

      - name: Backend lint
        run: pnpm exec eslint packages/agent-core packages/execution-runtime packages/cognitive-engine --max-warnings 0

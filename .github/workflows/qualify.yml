name: KLYN OS Production Qualification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: klyn-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace — format, compile, test, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Validate locked workspace
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict compilation
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --all-targets
      - name: Unit and integration tests
        run: cargo test --locked --workspace -- --nocapture
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  repository-security:
    name: Secret scanning and migration closure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Reject obvious raw credentials in tracked files
        shell: bash
        run: |
          set -Eeuo pipefail
          pattern='(sb_secret_[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{16,}\.eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}|postgres(ql)?://[^[:space:]/]+:[^<@[:space:]][^@[:space:]]*@|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*(eyJ[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9]{20,}))'
          if git grep -I -l -E "$pattern" -- . ':(exclude)**/*.lock'; then
            echo "::error::Potential credential material found in tracked files."
            exit 1
          fi
      - name: Verify local version closure against remote ledger snapshot
        run: bash scripts/ci/check-supabase-migration-ledger.sh

  supabase-local:
    name: Supabase replay, lint and multi-tenant smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Start disposable Supabase
        run: supabase start --exclude studio,inbucket,imgproxy,analytics
      - name: Replay all migrations against a clean local database
        run: supabase db reset --local --no-seed
      - name: Lint database schema
        run: supabase db lint --local --schema public,private --level warning --fail-on error
      - name: Load ephemeral local API config into environment without printing credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          status="$(supabase status -o env)"
          value() {
            printf '%s\n' "$status" | sed -n "s/^$1=//p" | sed -E 's/^"(.*)"$/\1/' | head -n 1
          }
          api_url="$(value API_URL)"
          anon_key="$(value ANON_KEY)"
          service_key="$(value SERVICE_ROLE_KEY)"
          [[ -n "$api_url" && -n "$anon_key" && -n "$service_key" ]] || {
            echo "::error::Supabase local status omitted required API settings"; exit 1;
          }
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
          } >> "$GITHUB_ENV"
      - name: Test tenant isolation with synthetic users
        run: pnpm --filter @klyn/db-client exec node ./tests/multi-tenant-isolation-smoke.mjs

  production-migration-drift:
    name: Live migration-history parity (protected main pushes only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGOPTIONS: "-c default_transaction_read_only=on"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare local and live migration versions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$DATABASE_URL" ]] || {
            echo "::error::Repository secret DATABASE_URL is not configured"; exit 1;
          }
          local_versions="$(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
              sed -E 's/^([0-9]+)_.*/\1/' | LC_ALL=C sort
          )"
          remote_versions="$(
            psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1               -c 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version'
          )"
          diff -u <(printf '%s\n' "$remote_versions") <(printf '%s\n' "$local_versions")

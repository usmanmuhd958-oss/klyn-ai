name: P8.7 Distributed Event Transport Certification

on:
  push:
    branches: [p8.7/distributed-event-transport]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8.7-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '99c0153e88d8cade86451446ec79fe9d63de7a0c' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p87-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p87-files.txt; then exit 1; fi
          cat /tmp/klyn-p87-files.txt
      - name: Distributed Transport Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class DistributedEventBridge' packages/ai-engine/src/distributed-event-transport.ts
          grep -q 'at-least-once' packages/ai-engine/src/distributed-event-transport.ts
          grep -q 'class InMemoryDurableEventTransport' packages/ai-engine/src/distributed-event-transport.ts
          grep -q 'DistributedEventBridge' packages/ai-engine/src/index.ts
      - name: Rehydration Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class ClusterStateRehydrator' apps/backend/src/distributed-state.ts
          grep -q 'Non-contiguous context history' apps/backend/src/distributed-state.ts
          grep -q 'revision' apps/backend/src/distributed-state.ts
          grep -q 'ClusterStateRehydrator' apps/backend/tests/phase8.7-distributed-event-transport.test.ts
      - name: Heartbeat Failover Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class NodeHeartbeatMonitor' apps/backend/src/node-heartbeat-monitor.ts
          grep -q 'status: "evicted"' apps/backend/src/node-heartbeat-monitor.ts
          grep -q 'async reconcile' apps/backend/src/node-heartbeat-monitor.ts
          grep -q 'reassignOrphans' apps/backend/src/node-heartbeat-monitor.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

name: P7.0 Kernel Production Certification

on:
  push:
    branches: [p7.0/kernel-production-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7.0-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint

      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '5401b48ce569d0b917a93b031c83653a0c2c1748' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-phase70-changed-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-phase70-changed-files.txt; then
            echo 'Frontend/UI files changed in Phase 7.0 diff.'
            exit 1
          fi
          echo 'Phase 7.0 changed files:'
          cat /tmp/klyn-phase70-changed-files.txt

      - name: Workspace Output Audit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if git status --short | grep -E '(^|/)(dist|build|coverage|\.turbo)(/|$)'; then
            echo 'Generated build output is tracked or modified.'
            exit 1
          fi
          test -f pnpm-lock.yaml
          echo 'Workspace output audit passed.'

      - name: Dead Export Audit
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            packages/execution-runtime/src/index.ts \
            packages/cognitive-engine/src/index.ts \
            packages/ai-engine/src/index.ts \
            apps/backend/src/index.ts; do
            test -s "$file"
            grep -Eq '(^|[[:space:]])export([[:space:]]|\*)' "$file"
          done
          grep -q 'KernelHealthController' apps/backend/src/index.ts
          grep -q 'RouterPipeline' packages/ai-engine/src/index.ts
          echo 'Export surface audit passed.'

      - name: Process Exception Audit
        shell: bash
        run: |
          set -euo pipefail
          test "${NODE_OPTIONS:-}" = "--unhandled-rejections=strict" || exit 1
          echo 'Unhandled promise rejections are configured as process-fatal during certification.'
          echo 'No uncaught process exception was observed if the Test Gate completed successfully.'

      - name: Lockfile SHA-256
        run: sha256sum pnpm-lock.yaml

name: Klyn Lockfile Bootstrap

on:
  push:
    branches:
      - p2/agent-swarm-runtime-hardening

permissions:
  contents: write

concurrency:
  group: klyn-lockfile-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: p2/agent-swarm-runtime-hardening
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Generate canonical lockfile
        if: ${{ !hashFiles('pnpm-lock.yaml') }}
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --no-frozen-lockfile

      - name: Verify lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          git diff --check

      - name: Commit canonical lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already committed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(workspace): generate canonical pnpm lockfile"
          git push origin HEAD:p2/agent-swarm-runtime-hardening

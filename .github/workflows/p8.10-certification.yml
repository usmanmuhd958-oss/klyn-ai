name: P8.10 Distributed Orchestration Stabilization Certification

on:
  push:
    branches: [p8.10/ci-stabilization-green]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: p8.10-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '3c145b59584acdb500518342796f46248cba453c' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p810-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p810-files.txt; then exit 1; fi
          cat /tmp/klyn-p810-files.txt
      - name: Orchestration Wiring Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class MasterExecutionOrchestrator' apps/backend/src/master-execution-orchestrator.ts
          grep -q 'memory.publish' apps/backend/src/master-execution-orchestrator.ts
          grep -q 'consensus.beginProposal' apps/backend/src/master-execution-orchestrator.ts
          grep -q 'deadlocks.detect' apps/backend/src/master-execution-orchestrator.ts
          grep -q 'resolver.resolve' apps/backend/src/master-execution-orchestrator.ts
          grep -q 'P8.10 end-to-end orchestration is green' apps/backend/tests/phase8.10-master-orchestration.test.ts
      - name: Vercel Ignore Audit
        shell: bash
        run: |
          set -euo pipefail
          test -f vercel-ignore-build.sh
          grep -q 'apps/studio/apps/web' vercel-ignore-build.sh
          grep -q 'ignoreCommand' vercel.json
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

  certification-report:
    if: github.event_name == 'pull_request'
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - name: Publish certification summary
        run: |
          echo "P8.10 certification gates and downstream audits completed successfully."
          echo "Vercel is decoupled through vercel-ignore-build.sh + vercel.json ignoreCommand."
          echo "Backend orchestration path: Event ingress -> semantic memory -> consensus -> deadlock detection/recovery."

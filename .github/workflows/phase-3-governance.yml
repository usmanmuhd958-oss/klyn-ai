name: Phase 3 Governance Certification

on:
  push:
    branches: [phase-3-governance]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm exec tsc -p packages/governance/tsconfig.json --noEmit
      - name: Test Compile Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm exec tsc -p packages/governance/tsconfig.test.json
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 300s node --test --test-timeout=15000 /tmp/klyn-governance-test-dist/tests/governance.test.js
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm exec tsc -p packages/governance/tsconfig.json
      - name: Strict Type Audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\bany\b' packages/governance/src packages/governance/tests; then
            echo 'Forbidden any type detected.' >&2
            exit 1
          fi
      - name: Frontend Isolation Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || 'd29bb5b6c7adc613b1bb6c52cd188c5b114e4c03' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-phase3-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-phase3-files.txt; then
            echo 'Frontend/UI files detected in Phase 3 changes.' >&2
            exit 1
          fi
          if grep -E -v '^packages/governance/|^\.github/workflows/phase-3-governance\.yml$' /tmp/klyn-phase3-files.txt; then
            echo 'Unexpected files detected outside the Phase 3 governance boundary.' >&2
            exit 1
          fi
          cat /tmp/klyn-phase3-files.txt

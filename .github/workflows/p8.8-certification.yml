name: P8.8 Consensus Deadlock Resolution Certification

on:
  push:
    branches: [p8.8/consensus-deadlock-resolution]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8.8-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/ai-engine --filter @klyn/cognitive-engine --filter @klyn/backend test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '7b9757bbc462538abda1be801074c37fe2612e3f' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p88-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p88-files.txt; then exit 1; fi
          cat /tmp/klyn-p88-files.txt
      - name: Consensus Protocol Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class AgentConsensusEngine' packages/cognitive-engine/src/consensus/AgentConsensusEngine.ts
          grep -q 'quorumSize' packages/cognitive-engine/src/consensus/AgentConsensusEngine.ts
          grep -q 'Stale consensus term' packages/cognitive-engine/src/consensus/AgentConsensusEngine.ts
          grep -q 'AgentConsensusEngine' packages/cognitive-engine/src/index.ts
      - name: Deadlock WFG Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class DeadlockDetector' packages/cognitive-engine/src/consensus/DeadlockDetector.ts
          grep -q 'waiter' packages/cognitive-engine/src/consensus/DeadlockDetector.ts
          grep -q 'stack' packages/cognitive-engine/src/consensus/DeadlockDetector.ts
          grep -q 'DeadlockDetector' apps/backend/tests/phase8.8-consensus-deadlock.test.ts
      - name: Self Healing Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class SelfHealingStateResolver' packages/cognitive-engine/src/consensus/SelfHealingStateResolver.ts
          grep -q 'evictLock' packages/cognitive-engine/src/consensus/SelfHealingStateResolver.ts
          grep -q 'rewind' packages/cognitive-engine/src/consensus/SelfHealingStateResolver.ts
          grep -q 'SelfHealingStateResolver' apps/backend/tests/phase8.8-consensus-deadlock.test.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

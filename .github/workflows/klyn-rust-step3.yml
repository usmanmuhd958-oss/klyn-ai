name: KLYN Rust Sandbox and Worker Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - feat/step3-worker-bootstrap
  pull_request:
    branches:
      - main
      - master
      - feat/klyn-step2-transactional-fs
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/klyn-sandbox/**
      - .github/workflows/klyn-rust-step3.yml
      - .gitlab-ci.yml
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: klyn-rust-step3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Report toolchain and Linux kernel
        run: |
          rustc --version
          cargo --version
          uname -a
      - name: Verify locked workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Sandbox unit and integration tests
        run: cargo test --locked -p klyn-sandbox
      - name: Sandbox Clippy
        run: cargo clippy --locked -p klyn-sandbox --all-targets -- -D warnings

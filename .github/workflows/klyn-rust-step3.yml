name: KLYN Rust Sandbox and Worker Bootstrap

on:
  workflow_dispatch:
    inputs:
      run_native_linux_qualification:
        description: "Run privileged sandbox qualification on a dedicated ephemeral Linux runner"
        required: true
        type: boolean
        default: false
      run_fuzz_campaign:
        description: "Run one million iterations for each cargo-fuzz target"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/step3-worker-bootstrap
      - reconcile/step3-platform-daemon
      - feat/step4-shared-memory-ipc
      - feat/phase2-step2-ebpf-telemetry
      - feat/phase2-step3-kel-attestation
      - feat/phase2-step4-fs-rollback
      - feat/phase2-step5-fuzz-native-qualification
  pull_request:
    branches:
      - main
      - master
      - feat/klyn-step2-transactional-fs
      - reconcile/step3-platform-daemon
      - feat/step4-shared-memory-ipc
      - feat/phase2-step2-ebpf-telemetry
      - feat/phase2-step3-kel-attestation
      - feat/phase2-step4-fs-rollback
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/klyn-sandbox/**
      - crates/klyn-daemon/**
      - crates/klyn-fs/**
      - crates/klyn-protocol/**
      - docs/phase2-step3-kel-attestation.md
      - .github/workflows/klyn-rust-step3.yml
      - .gitlab-ci.yml
      - rust-toolchain.toml
      - scripts/**

permissions:
  contents: read

concurrency:
  group: klyn-rust-step3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and workspace build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99.0-
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Report toolchain and Linux kernel
        run: |
          rustc --version
          cargo --version
          uname -a
      - name: Syntax-check native and fuzz harnesses
        run: |
          bash -n scripts/qualify-native-linux.sh scripts/qualify_native_linux.sh scripts/orchestrate_native_qualification.sh scripts/reconcile_cross_provider.sh scripts/run_fuzz_campaign.sh
          # Verify native qualification rejects an unprovisioned host before any kernel test runs.
          probe_log="$(mktemp)"
          if env -u KLYN_NATIVE_QUALIFICATION_READY -u KLYN_NATIVE_EPHEMERAL_VM bash scripts/orchestrate_native_qualification.sh >"$probe_log" 2>&1; then
            cat "$probe_log"
            rm -f "$probe_log"
            echo "::error::native orchestrator unexpectedly accepted an unprovisioned host"
            exit 1
          fi
          grep -q "KLYN_NATIVE_QUALIFICATION_READY must be exactly 'true'" "$probe_log" || {
            cat "$probe_log"
            rm -f "$probe_log"
            echo "::error::native orchestrator failed for an unexpected reason"
            exit 1
          }
          cat "$probe_log"
          rm -f "$probe_log"
      - name: Install Android target for platform-boundary check
        run: rustup target add aarch64-linux-android
      - name: Check workspace for Android with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --all-targets --target aarch64-linux-android
      - name: Verify locked workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Check all workspace targets with warnings denied
        run: RUSTFLAGS="-D warnings" cargo check --locked --workspace --all-targets
      - name: Workspace unit and integration tests
        run: cargo test --locked --workspace -- --nocapture
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Opt-in only: this job needs an ephemeral, isolated Linux runner with
  # delegated cgroup v2 and pre-provisioned trusted native worker files.
  native-linux-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/reconcile/step3-platform-daemon' || github.ref == 'refs/heads/feat/step4-shared-memory-ipc' || github.ref == 'refs/heads/feat/phase2-step3-kel-attestation' || github.ref == 'refs/heads/feat/phase2-step4-fs-rollback' || github.ref == 'refs/heads/feat/phase2-step5-fuzz-native-qualification') && inputs.run_native_linux_qualification == true && vars.KLYN_NATIVE_QUALIFICATION_READY == 'true' }}
    runs-on: [self-hosted, linux, klyn-native-qualification]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Run mandatory native Linux kernel qualification
        env:
          KLYN_REQUIRE_NATIVE_LINUX_QUALIFICATION: "1"
          KLYN_NATIVE_QUALIFICATION_READY: ${{ vars.KLYN_NATIVE_QUALIFICATION_READY }}
          KLYN_NATIVE_EPHEMERAL_VM: ${{ vars.KLYN_NATIVE_EPHEMERAL_VM }}
          KLYN_NATIVE_EVIDENCE_ROOT: ${{ runner.temp }}
        run: bash scripts/orchestrate_native_qualification.sh
      - name: Upload native qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: klyn-native-qualification-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/klyn-native-qualification-*
          if-no-files-found: ignore
          retention-days: 14

  qualification-summary:
    name: Required CI and native qualification status
    if: ${{ always() }}
    needs:
      - verify
      - fuzz-targets
      - fuzz-campaign
      - ebpf-object-compile
      - native-linux-qualification
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Enforce required jobs and report native qualification state
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          FUZZ_TARGETS_RESULT: ${{ needs['fuzz-targets'].result }}
          FUZZ_CAMPAIGN_RESULT: ${{ needs['fuzz-campaign'].result }}
          EBPF_RESULT: ${{ needs['ebpf-object-compile'].result }}
          NATIVE_RESULT: ${{ needs['native-linux-qualification'].result }}
          NATIVE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.run_native_linux_qualification == true }}
          NATIVE_READY: ${{ vars.KLYN_NATIVE_QUALIFICATION_READY }}
          FUZZ_CAMPAIGN_REQUIRED: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_fuzz_campaign == true) }}
        run: |
          set -euo pipefail
          [[ "$VERIFY_RESULT" == "success" ]] || { echo "::error::verify did not succeed (result=$VERIFY_RESULT)"; exit 1; }
          [[ "$FUZZ_TARGETS_RESULT" == "success" ]] || { echo "::error::fuzz-targets did not succeed (result=$FUZZ_TARGETS_RESULT)"; exit 1; }
          [[ "$EBPF_RESULT" == "success" ]] || { echo "::error::ebpf-object-compile did not succeed (result=$EBPF_RESULT)"; exit 1; }

          if [[ "$FUZZ_CAMPAIGN_REQUIRED" == "true" ]]; then
            [[ "$FUZZ_CAMPAIGN_RESULT" == "success" ]] || { echo "::error::required fuzz-campaign did not succeed (result=$FUZZ_CAMPAIGN_RESULT)"; exit 1; }
          fi

          if [[ "$NATIVE_REQUESTED" == "true" ]]; then
            if [[ "$NATIVE_READY" != "true" ]]; then
              echo "::error::Native qualification was requested, but repository variable KLYN_NATIVE_QUALIFICATION_READY is not 'true'. Provision the dedicated runner and trusted assets first."
              exit 1
            fi
            [[ "$NATIVE_RESULT" == "success" ]] || { echo "::error::Native qualification was requested but the job result is $NATIVE_RESULT"; exit 1; }
            {
              echo "## Native Linux qualification"
              echo "PASS — mandatory native qualification completed on the dedicated runner."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Native Linux qualification"
              echo "NOT RUN — this workflow did not request native qualification."
              echo "This run is not evidence of live cgroup-v2, Landlock ABI v8, Seccomp-BPF, or eBPF ring-buffer qualification."
              echo "To run it, provision the dedicated self-hosted runner and trusted assets, set repository Actions variable KLYN_NATIVE_QUALIFICATION_READY=true, then dispatch with run_native_linux_qualification=true."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Native Linux qualification was not requested. This workflow run is not a native runtime certification."
          fi

  fuzz-targets:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-fuzz dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-fuzz
            crates/klyn-sandbox/fuzz/target
          key: ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'crates/klyn-sandbox/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          installed_version="$(cargo-fuzz --version 2>/dev/null || true)"
          if [[ "$installed_version" == "cargo-fuzz 0.13.2" ]]; then
            echo "Using cached cargo-fuzz 0.13.2"
          else
            cargo +nightly install cargo-fuzz --version 0.13.2 --locked --force
          fi
      - name: Validate committed fuzz lockfile
        run: cargo +nightly metadata --locked --format-version 1 --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml > /dev/null
      - name: Format fuzz workspace
        run: cargo +nightly fmt --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml -- --check
      - name: Clippy fuzz workspace with warnings denied
        run: cargo +nightly clippy --locked --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Compile both fuzz targets
        working-directory: crates/klyn-sandbox/fuzz
        run: |
          cargo +nightly fuzz build fuzz_ipc_frame
          cargo +nightly fuzz build fuzz_kel_parser
          git -C "$GITHUB_WORKSPACE" diff --exit-code -- crates/klyn-sandbox/fuzz/Cargo.lock

  fuzz-campaign:
    # Every PR runs the full fuzz budget; workflow_dispatch can opt in on a
    # branch even without a PR. Pushes do not duplicate the expensive campaign.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_fuzz_campaign == true) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-fuzz dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-fuzz
            crates/klyn-sandbox/fuzz/target
          key: ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'crates/klyn-sandbox/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          installed_version="$(cargo-fuzz --version 2>/dev/null || true)"
          if [[ "$installed_version" == "cargo-fuzz 0.13.2" ]]; then
            echo "Using cached cargo-fuzz 0.13.2"
          else
            cargo +nightly install cargo-fuzz --version 0.13.2 --locked --force
          fi
      - name: Run million-iteration fuzz campaign
        env:
          RUSTUP_TOOLCHAIN: nightly
          KLYN_FUZZ_RUNS: "1000000"
        run: bash scripts/run_fuzz_campaign.sh
      - name: Verify campaign preserved the pinned fuzz lockfile
        run: git diff --exit-code -- crates/klyn-sandbox/fuzz/Cargo.lock

  ebpf-object-compile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm bpftool libbpf-dev
      - name: Compile CO-RE telemetry object when runner BTF is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -r /sys/kernel/btf/vmlinux ]]; then
            echo "::notice::/sys/kernel/btf/vmlinux unavailable; native eBPF compile skipped; native qualification remains required on a BTF-enabled host"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/klyn-bpf"
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > "$RUNNER_TEMP/klyn-bpf/vmlinux.h"
          clang -O2 -g -Werror -Wno-missing-declarations -target bpf -D__TARGET_ARCH_x86 \
            -I"$RUNNER_TEMP/klyn-bpf" -I/usr/include/bpf -I/usr/include/x86_64-linux-gnu \
            -c crates/klyn-sandbox/ebpf/klyn_telemetry.bpf.c \
            -o "$RUNNER_TEMP/klyn-bpf/klyn_telemetry.bpf.o"
          test -s "$RUNNER_TEMP/klyn-bpf/klyn_telemetry.bpf.o"

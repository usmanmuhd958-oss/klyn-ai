name: KLYN Rust Sandbox and Worker Bootstrap

on:
  workflow_dispatch:
    inputs:
      run_native_linux_qualification:
        description: "Run privileged sandbox qualification on a dedicated ephemeral Linux runner"
        required: true
        type: boolean
        default: false
      run_fuzz_campaign:
        description: "Run one million iterations for each cargo-fuzz target"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/step3-worker-bootstrap
      - reconcile/step3-platform-daemon
      - feat/step4-shared-memory-ipc
      - feat/phase2-step2-ebpf-telemetry
      - feat/phase2-step3-kel-attestation
      - feat/phase2-step4-fs-rollback
      - feat/phase2-step5-fuzz-native-qualification
  pull_request:
    branches:
      - main
      - master
      - feat/klyn-step2-transactional-fs
      - reconcile/step3-platform-daemon
      - feat/step4-shared-memory-ipc
      - feat/phase2-step2-ebpf-telemetry
      - feat/phase2-step3-kel-attestation
      - feat/phase2-step4-fs-rollback
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/klyn-sandbox/**
      - crates/klyn-daemon/**
      - crates/klyn-fs/**
      - crates/klyn-protocol/**
      - docs/phase2-step3-kel-attestation.md
      - .github/workflows/klyn-rust-step3.yml
      - .gitlab-ci.yml
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: klyn-rust-step3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and workspace build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-1.99.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.99.0-
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Report toolchain and Linux kernel
        run: |
          rustc --version
          cargo --version
          uname -a
      - name: Syntax-check native and fuzz harnesses
        run: bash -n scripts/qualify-native-linux.sh scripts/qualify_native_linux.sh scripts/run_fuzz_campaign.sh
      - name: Install Android target for platform-boundary check
        run: rustup target add aarch64-linux-android
      - name: Check workspace for Android with warnings denied
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --locked --workspace --all-targets --target aarch64-linux-android
      - name: Verify locked workspace metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format workspace
        run: cargo fmt --all -- --check
      - name: Check all workspace targets with warnings denied
        run: RUSTFLAGS="-D warnings" cargo check --locked --workspace --all-targets
      - name: Workspace unit and integration tests
        run: cargo test --locked --workspace -- --nocapture
      - name: Workspace Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Opt-in only: this job needs an ephemeral, isolated Linux runner with
  # delegated cgroup v2 and pre-provisioned trusted native worker files.
  native-linux-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/reconcile/step3-platform-daemon' || github.ref == 'refs/heads/feat/step4-shared-memory-ipc' || github.ref == 'refs/heads/feat/phase2-step3-kel-attestation' || github.ref == 'refs/heads/feat/phase2-step4-fs-rollback' || github.ref == 'refs/heads/feat/phase2-step5-fuzz-native-qualification') && inputs.run_native_linux_qualification == true }}
    runs-on: [self-hosted, linux, klyn-native-qualification]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Run mandatory native Linux kernel qualification
        env:
          KLYN_REQUIRE_NATIVE_LINUX_QUALIFICATION: "1"
        run: bash scripts/qualify_native_linux.sh
  fuzz-targets:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-fuzz dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-fuzz
            crates/klyn-sandbox/fuzz/target
          key: ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'crates/klyn-sandbox/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Format fuzz workspace
        run: cargo +nightly fmt --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml -- --check
      - name: Compile both fuzz targets
        working-directory: crates/klyn-sandbox/fuzz
        run: |
          cargo +nightly fuzz build fuzz_ipc_frame
          cargo +nightly fuzz build fuzz_kel_parser

  fuzz-campaign:
    # Every PR runs the full fuzz budget; workflow_dispatch can opt in on a
    # branch even without a PR. Pushes do not duplicate the expensive campaign.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_fuzz_campaign == true) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache cargo-fuzz dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-fuzz
            crates/klyn-sandbox/fuzz/target
          key: ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'crates/klyn-sandbox/Cargo.toml', 'crates/klyn-sandbox/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-nightly-cargo-fuzz-0.13.2-
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - name: Run million-iteration fuzz campaign
        env:
          RUSTUP_TOOLCHAIN: nightly
          KLYN_FUZZ_RUNS: "1000000"
        run: bash scripts/run_fuzz_campaign.sh

  ebpf-object-compile:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm bpftool libbpf-dev
      - name: Compile CO-RE telemetry object when runner BTF is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -r /sys/kernel/btf/vmlinux ]]; then
            echo "::warning::/sys/kernel/btf/vmlinux unavailable; native eBPF compile skipped"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/klyn-bpf"
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > "$RUNNER_TEMP/klyn-bpf/vmlinux.h"
          clang -O2 -g -target bpf -D__TARGET_ARCH_x86 \
            -I"$RUNNER_TEMP/klyn-bpf" -I/usr/include/bpf -I/usr/include/x86_64-linux-gnu \
            -c crates/klyn-sandbox/ebpf/klyn_telemetry.bpf.c \
            -o "$RUNNER_TEMP/klyn-bpf/klyn_telemetry.bpf.o"

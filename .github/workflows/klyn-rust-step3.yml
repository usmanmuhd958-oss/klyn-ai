name: KLYN Rust OS Sandbox Enforcement

on:
  push:
    branches:
      - feat/klyn-step3-os-sandbox
  pull_request:
    branches:
      - main
      - master
      - feat/klyn-step2-transactional-fs
    paths:
      - Cargo.toml
      - crates/klyn-sandbox/**
      - crates/klyn-daemon/**
      - crates/klyn-fs/**
      - crates/klyn-protocol/**
      - .github/workflows/klyn-rust-step3.yml

permissions:
  contents: write

concurrency:
  group: klyn-rust-step3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Persist formatted Rust sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/klyn-step3-os-sandbox'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/klyn-sandbox crates/klyn-daemon
            git commit -m "style(rust): apply rustfmt to Step 3 implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Unit and integration tests
        run: cargo test --package klyn-fs --package klyn-protocol --package klyn-daemon --package klyn-sandbox
      - name: Clippy
        run: cargo clippy --package klyn-fs --package klyn-protocol --package klyn-daemon --package klyn-sandbox --all-targets -- -D warnings

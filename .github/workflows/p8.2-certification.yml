name: P8.2 Micro-Sandbox Process Isolation Certification
on:
  push:
    branches: [p8.2/micro-sandbox-process-isolation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p8.2-certification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with: { version: 11.24.0 }
      - name: Set up Node
        uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '0b42998cd8a69e953ea4d1587ddd0a363449bf3d' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p82-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p82-files.txt; then exit 1; fi
          cat /tmp/klyn-p82-files.txt
      - name: Sandbox Safety Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ProcessSandboxManager' packages/execution-runtime/src/index.ts
          grep -q 'SecretMasker' packages/execution-runtime/src/index.ts
          grep -q 'shell: false' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'globalThis.setTimeout' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'globalThis.setInterval' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'globalThis.clearInterval' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'acquireFence' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'maskEnvironment' packages/execution-runtime/src/secret-masker.ts
          grep -q 'redact' packages/execution-runtime/src/secret-masker.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        run: sha256sum pnpm-lock.yaml

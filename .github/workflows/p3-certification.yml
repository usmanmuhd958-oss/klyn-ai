name: Klyn P3 Certification

on:
  push:
    branches:
      - p2/agent-swarm-runtime-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klyn-p3-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Validate runtime toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          test "$(node --version)" = "v22.23.2"
          test "$(pnpm --version)" = "11.24.0"

      - name: Validate workspace contract
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-workspace.yaml
          test -s pnpm-lock.yaml
          test -s turbo.json
          test -s apps/backend/package.json

      - name: Frozen Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck 1.brain
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' brain_files < <(find 1.brain -type f -name '*.ts' -print0)
          test "${#brain_files[@]}" -gt 0
          pnpm exec tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --moduleDetection force --types node --skipLibCheck "${brain_files[@]}"

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Lockfile SHA-256
        shell: bash
        run: sha256sum pnpm-lock.yaml

      - name: Certification marker
        run: echo "P3.8 cloud audit — final candidate"

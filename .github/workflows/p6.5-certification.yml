name: P6.5 Cloud Certification

on:
  push:
    branches: [p6.5/supabase-realtime-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p6.5-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Workspace Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-phase65-changed-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-phase65-changed-files.txt; then
            echo 'Frontend/UI files changed in Phase 6.5 diff.'
            exit 1
          fi
          echo 'Phase 6.5 changed files:'
          cat /tmp/klyn-phase65-changed-files.txt
      - name: Supabase Migration Shape Audit
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/009_execution_ledger_realtime.sql
          grep -q 'create table if not exists public.executions' supabase/migrations/009_execution_ledger_realtime.sql
          grep -q 'create table if not exists public.agent_logs' supabase/migrations/009_execution_ledger_realtime.sql
          grep -q 'create table if not exists public.dag_states' supabase/migrations/009_execution_ledger_realtime.sql
          grep -q 'create table if not exists public.provider_telemetry' supabase/migrations/009_execution_ledger_realtime.sql
          grep -q 'enable row level security' supabase/migrations/009_execution_ledger_realtime.sql
      - name: Lockfile SHA-256
        run: sha256sum pnpm-lock.yaml

name: P8.6 Autonomous Sandbox Runtime Isolation Certification

on:
  push:
    branches: [p8.6/sandbox-runtime-isolation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8.6-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/execution-runtime --filter @klyn/backend typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/cognitive-engine --filter @klyn/execution-runtime --filter @klyn/backend test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || 'bd8206bff360532cd1a35b4b5ab158e783849bf3' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p86-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p86-files.txt; then exit 1; fi
          cat /tmp/klyn-p86-files.txt
      - name: Sandbox Boundary Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class ResourceBoundaryEnforcer' packages/execution-runtime/src/resource-boundary-enforcer.ts
          grep -q 'class EphemeralSandboxRuntime' packages/execution-runtime/src/ephemeral-sandbox-runtime.ts
          grep -q 'class RuntimeSnapshotEngine' packages/execution-runtime/src/runtime-snapshot-engine.ts
          grep -q 'shell: false' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'maxFileDescriptors' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'maxCpuMs' packages/execution-runtime/src/process-sandbox-manager.ts
          grep -q 'phase8.6-sandbox-runtime' apps/backend/tests/phase8.6-sandbox-runtime.test.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

name: Klyn OS CI
on: [push, pull_request]
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - name: Start API and Run Health Check
        env:
          JWT_SECRET: ***REMOVED***
          ADMIN_PASSWORD: klyn
        run: |
          node api/server.js &
          sleep 4
          node scripts/health_check.js

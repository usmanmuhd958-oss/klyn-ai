name: Klyn OS CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: |
          export JWT_SECRET="***REMOVED***"
          export ADMIN_PASSWORD="klyn"
          node scripts/health_check.js

  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
      - run: |
          export JWT_SECRET="***REMOVED***"
          export ADMIN_PASSWORD="klyn"
          node api/server.js &
          sleep 5
          node scripts/health_check.js

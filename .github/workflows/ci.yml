name: Klyn OS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate TypeScript build
        run: |
          if [ -f "tsconfig.json" ]; then
            npx tsc --noEmit || true
          fi

      - name: Run Native Rust Engine Diagnostics
        run: |
          if [ -d "native/kernel_core" ]; then
            cd native/kernel_core
            cargo check || true
          fi

      - name: Run Stabilizer Script (If present)
        env:
          JWT_SECRET: klyn-royal-secret
          ADMIN_PASSWORD: klyn
        run: |
          if [ -f "tools/stabilize_klyn_os.sh" ]; then
            bash tools/stabilize_klyn_os.sh
          else
            echo "Stabilizer script not found, skipping..."
          fi

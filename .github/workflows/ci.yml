name: Klyn OS CI
on: [push, pull_request]
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - name: Start API and Run Health Check
        env:
          JWT_SECRET: klyn-royal-secret
          ADMIN_PASSWORD: klyn
        run: |
          node api/server.js &
          sleep 5
          node scripts/health_check.js || {
            echo "🔴 API failed – printing logs:"
            cat runtime/logs/api.log 2>/dev/null || true
            exit 1
          }

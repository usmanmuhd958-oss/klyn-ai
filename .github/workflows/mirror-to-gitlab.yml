name: Mirror to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        run: |
          git push --force https://gitlab-ci-token:$\{\{ secrets.GITLAB_TOKEN }}@gitlab.com/usmanmuhd958-oss/klyn-ai.git main:main

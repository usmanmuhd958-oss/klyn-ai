name: Mirror to GitLab

on:
  push:
    branches:
      - main
      - feat/step3-worker-bootstrap
      - reconcile/step3-platform-daemon
      - feat/step4-shared-memory-ipc
      - feat/phase2-step2-ebpf-telemetry
      - feat/phase2-step3-kel-attestation
      - feat/phase2-step4-fs-rollback
      - feat/phase2-step5-fuzz-native-qualification
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_KEY }}

      - name: Add GitLab to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Push to GitLab
        run: |
          git remote add gitlab git@gitlab.com:usmanmuhd958-oss/klyn-ai.git || git remote set-url gitlab git@gitlab.com:usmanmuhd958-oss/klyn-ai.git
git push gitlab "$GITHUB_REF_NAME:$GITHUB_REF_NAME"

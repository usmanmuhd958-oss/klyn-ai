name: Mirror to GitLab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab via token secret
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_TOKEN"

          askpass="$RUNNER_TEMP/klyn-gitlab-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'oauth2' ;;
            *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
            *) printf '%s\n' '' ;;
          esac
          EOF
          chmod 700 "$askpass"

          GIT_ASKPASS="$askpass" \
          GIT_TERMINAL_PROMPT=0 \
          git push --force "https://gitlab.com/usmanmuhd958-oss/klyn-ai.git" main:main

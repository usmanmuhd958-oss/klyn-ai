name: P8.3 Multi-Agent Orchestration Event Bus Certification

on:
  push:
    branches: [p8.3/multi-agent-orchestration-event-bus]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8.3-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/backend --filter @klyn/execution-runtime --filter @klyn/cognitive-engine --filter @klyn/ai-engine test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '50e70d3268d3e73a96d321e54bb8fc76ed3f02c4' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p83-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p83-files.txt; then exit 1; fi
          cat /tmp/klyn-p83-files.txt
      - name: Swarm Event Bus Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AgentEventBus' packages/cognitive-engine/src/swarm/AgentEventBus.ts
          grep -q 'SwarmRouter' packages/cognitive-engine/src/swarm/SwarmRouter.ts
          grep -q 'ContextStore' packages/cognitive-engine/src/swarm/ContextStore.ts
          grep -q 'subscribe' packages/cognitive-engine/src/swarm/AgentEventBus.ts
          grep -q 'publish' packages/cognitive-engine/src/swarm/AgentEventBus.ts
          grep -q 'dispatchParallel' packages/cognitive-engine/src/swarm/SwarmRouter.ts
          grep -q 'snapshot' packages/cognitive-engine/src/swarm/ContextStore.ts
          grep -q 'Object.freeze' packages/cognitive-engine/src/swarm/ContextStore.ts
          grep -q 'phase 8.3' apps/backend/tests/phase8.3-orchestration.test.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

name: P8.4 Provider Fallback Routing Telemetry Certification

on:
  push:
    branches: [p8.4/provider-fallback-routing-telemetry]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8.4-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --unhandled-rejections=strict
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Frozen Install Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm install --frozen-lockfile
      - name: TypeScript Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm --filter @klyn/backend --filter @klyn/ai-engine typecheck
      - name: Build Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm build
      - name: Test Gate
        run: timeout --signal=TERM --kill-after=15s 600s pnpm --filter @klyn/backend --filter @klyn/ai-engine test
      - name: Real Lint Gate
        run: timeout --signal=TERM --kill-after=15s 300s pnpm lint
      - name: Backend Scope Audit
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '7a0d4f6a4f0ee0b7df691910283823e2bda4e2dc' }}"
          git diff --name-only "$BASE_SHA"...HEAD > /tmp/klyn-p84-files.txt
          if grep -E '(^|/)(apps/frontend|apps/studio|apps/web|packages/frontend)(/|$)|\.(tsx|jsx|css|scss|sass|html)$' /tmp/klyn-p84-files.txt; then exit 1; fi
          cat /tmp/klyn-p84-files.txt
      - name: Provider Resilience Audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FallbackRouter' packages/ai-engine/src/fallback-router.ts
          grep -q 'CircuitBreaker' packages/ai-engine/src/fallback-router.ts
          grep -q 'TokenTelemetryStreamer' packages/ai-engine/src/token-telemetry-streamer.ts
          grep -q 'recordFailure' packages/ai-engine/src/fallback-router.ts
          grep -q 'providerAttempts' packages/ai-engine/src/fallback-router.ts
          grep -q 'timeToFirstTokenMs' packages/ai-engine/src/token-telemetry-streamer.ts
          grep -q 'phase 8.4' apps/backend/tests/phase8.4-provider-routing.test.ts
      - name: Process Exception Audit
        run: test "${NODE_OPTIONS}" = "--unhandled-rejections=strict"
      - name: Lockfile SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum pnpm-lock.yaml | awk '{print $1}')" = "e80ae0addcd6a8c877aa5088837d8ba0d19f622f6ba139c4781a9f48c49bc73f"

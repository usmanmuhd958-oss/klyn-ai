name: Klyn Step 0 Baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: klyn-step0-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: AI engine typecheck
        run: pnpm --filter @klyn/ai-engine typecheck

      - name: AI engine tests
        run: pnpm --filter @klyn/ai-engine test

      - name: Runtime typecheck
        run: pnpm --filter @klyn/runtime typecheck

      - name: Runtime tests
        run: pnpm --filter @klyn/runtime test

      - name: Governance typecheck
        run: pnpm --filter @klyn/governance typecheck

      - name: Governance tests
        run: pnpm --filter @klyn/governance test

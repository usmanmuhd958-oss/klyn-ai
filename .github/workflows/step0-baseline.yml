name: Klyn Step 0 Baseline

on:
  push:
    branches: [arch/step0-workspace-alignment]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: klyn-step0-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Regenerate lockfile when workspace importers changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! pnpm install --frozen-lockfile; then
            pnpm install --lockfile-only --no-frozen-lockfile
            if git diff --quiet -- pnpm-lock.yaml; then
              echo "Lockfile regeneration produced no changes; failing baseline."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore(workspace): align lockfile importers"
            git push origin HEAD:arch/step0-workspace-alignment
            exit 0
          fi

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: AI engine typecheck
        run: pnpm --filter @klyn/ai-engine typecheck

      - name: AI engine tests
        run: pnpm --filter @klyn/ai-engine test

      - name: Runtime typecheck
        run: pnpm --filter @klyn/runtime typecheck

      - name: Runtime tests
        run: pnpm --filter @klyn/runtime test

      - name: Governance typecheck
        run: pnpm --filter @klyn/governance typecheck

      - name: Governance tests
        run: pnpm --filter @klyn/governance test

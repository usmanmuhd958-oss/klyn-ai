openapi: 3.1.0
info:
  title: KLYN Control Plane
  version: 1.0.0
  description: Deterministic fail-closed mission control contract.
paths:
  /v1/missions:
    post:
      operationId: createMission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMissionRequest'
      responses:
        '201':
          description: Mission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '409':
          description: Idempotency or state conflict
  /v1/missions/{missionId}:
    get:
      operationId: getMission
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Mission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
    post:
      operationId: transitionMission
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionMissionRequest'
      responses:
        '200':
          description: Transition committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '409':
          description: Optimistic-lock or invalid transition
        '423':
          description: Circuit breaker active
  /v1/missions/{missionId}/events:
    get:
      operationId: streamLedgerEvents
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - in: query
          name: afterSequence
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: Ordered immutable events
          content:
            application/x-ndjson:
              schema:
                type: string
  /v1/executions/credentials:
    post:
      operationId: requestCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
      responses:
        '200':
          description: Short-lived credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialGrant'
        '403':
          description: Capability denied
        '422':
          description: Invalid TTL
components:
  parameters:
    MissionId:
      in: path
      name: missionId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateMissionRequest:
      type: object
      additionalProperties: false
      required: [tenantId, policyId, objective, constraints, idempotencyKey]
      properties:
        tenantId: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        objective: {type: string, minLength: 1, maxLength: 10000}
        constraints:
          type: array
          items: {type: string}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128}
    TransitionMissionRequest:
      type: object
      additionalProperties: false
      required: [fromState, toState, expectedVersion, authorizationToken, idempotencyKey]
      properties:
        fromState: {type: string}
        toState: {type: string}
        expectedVersion: {type: string, pattern: '^[0-9]+$'}
        authorizationToken: {type: string, minLength: 16}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128}
        payload: {}
    CredentialRequest:
      type: object
      additionalProperties: false
      required: [executionId, provider, requestedScopes, audience, ttlSeconds]
      properties:
        executionId: {type: string, format: uuid}
        provider: {type: string, minLength: 1}
        requestedScopes:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        audience: {type: string, minLength: 1}
        ttlSeconds: {type: integer, minimum: 1, maximum: 900}
    CredentialGrant:
      type: object
      additionalProperties: false
      required: [credentialId, executionId, provider, scopes, expiresAt, audience, token]
      properties:
        credentialId: {type: string, format: uuid}
        executionId: {type: string, format: uuid}
        provider: {type: string}
        scopes:
          type: array
          items: {type: string}
        expiresAt: {type: string, format: date-time}
        audience: {type: string}
        token: {type: string}
    Mission:
      type: object
      properties:
        missionId: {type: string, format: uuid}
        tenantId: {type: string, format: uuid}
        policyId: {type: string, format: uuid}
        state: {type: string}
        version: {type: string}
        breakerLevel: {type: string}
        ledgerSequence: {type: string}
        ledgerHeadHash: {type: string, pattern: '^[a-f0-9]{64}$'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  RUST_BACKTRACE: 1
  GO_VERSION: "1.21"
  NODE_VERSION: "20"

jobs:
  # Rust Services Build & Test
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/kernel/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Lint Rust
        run: |
          cd services/kernel
          cargo clippy --all -- -D warnings
      
      - name: Build Rust
        run: |
          cd services/kernel
          cargo build --release
      
      - name: Test Rust
        run: |
          cd services/kernel
          cargo test --all --release

  # Go Services Build & Test
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, api-gateway, recovery]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Cache go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      
      - name: Lint Go
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          cd services/${{ matrix.service }}
          golangci-lint run
      
      - name: Build Go
        run: |
          cd services/${{ matrix.service }}
          go build -v ./cmd
      
      - name: Test Go
        run: |
          cd services/${{ matrix.service }}
          go test -v -race -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./services/${{ matrix.service }}/coverage.out

  # TypeScript Build & Test
  typescript-build:
    name: TypeScript Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace: [sdk/typescript, cli]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Lint TypeScript
        run: cd ${{ matrix.workspace }} && pnpm lint
      
      - name: Build TypeScript
        run: cd ${{ matrix.workspace }} && pnpm build
      
      - name: Test TypeScript
        run: cd ${{ matrix.workspace }} && pnpm test --coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  # Protocol Buffers Generation
  protobuf-check:
    name: Protocol Buffers Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install protoc
        run: |
          apt-get update
          apt-get install -y protobuf-compiler
      
      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      
      - name: Generate protobufs
        run: make generate
      
      - name: Check for uncommitted changes
        run: |
          git diff --exit-code || (echo "Proto files need regeneration" && exit 1)

  # Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rust-build, go-build, typescript-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: deploy/docker/Dockerfile.kernel
          push: false
          tags: klyn:kernel:${{ github.sha }}

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-build, go-build, typescript-build]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run integration tests
        run: |
          cd tests/integration
          go test -v -race ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/klyn_test

  # Determinism Tests
  determinism-tests:
    name: Determinism Verification
    runs-on: ubuntu-latest
    needs: [rust-build, go-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Run determinism tests
        run: |
          cd tests/determinism
          cargo test --release

  # Chaos Engineering Tests
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-build, go-build, typescript-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Run chaos tests
        run: |
          cd tests/chaos
          ./run_chaos_tests.sh

  # Code Coverage Report
  coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [rust-build, go-build, typescript-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Merge coverage reports
        run: |
          mkdir -p coverage-merged
          # Merge coverage from all tests
      
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage-merged

  # Publish Artifacts (on main branch)
  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Publish to Docker Registry
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/klyn:kernel:${{ github.sha }} -f deploy/docker/Dockerfile.kernel .
          docker push ${{ secrets.DOCKER_USERNAME }}/klyn:kernel:${{ github.sha }}
      
      - name: Publish Go modules
        run: |
          cd services/control-plane
          go get -u github.com/usmanmuhd958-oss/klyn-ai/proto
      
      - name: Publish NPM packages
        run: |
          npm config set @klyn-ai:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          cd sdk/typescript && npm publish
          cd ../../cli && npm publish

  # Deployment to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      
      - name: Deploy to Staging
        run: |
          kubectl config use-context staging
          make deploy
          kubectl rollout status statefulset/klyn-kernel -n klyn-system

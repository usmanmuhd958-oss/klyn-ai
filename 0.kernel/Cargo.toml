[package]
name = "klyn_kernel_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.1", default-features = false, features = ["napi9", "compat-mode"] }
napi-derive = "2.16.1"
zerocopy = { version = "0.7.32", features = ["derive"] }
parking_lot = { version = "0.12.1", default-features = false }
memmap2 = "0.9.0"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

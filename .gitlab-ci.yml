image: rust:1.99.0-bookworm

stages:
  - validate
  - test
  - fuzz
  - qualification

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"

cache:
  key:
    files:
      - Cargo.lock
    prefix: "klyn-rust-1.99.0"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - target/

before_script:
  - git --version
  - rustup component add rustfmt clippy
  - rustc --version
  - cargo --version
  - uname -a

validate_sandbox:
  stage: validate
  script:
    - cargo fmt --all -- --check
    - cargo metadata --locked --format-version 1 > /dev/null
    - RUSTFLAGS="-D warnings" cargo check --locked --workspace --all-targets

test_sandbox:
  stage: test
  script:
    - cargo test --locked --workspace -- --nocapture
    - cargo clippy --locked --workspace --all-targets -- -D warnings
fuzz_targets:
  stage: test
  timeout: 20m
  cache:
    key:
      files:
        - crates/klyn-sandbox/fuzz/Cargo.lock
        - crates/klyn-sandbox/fuzz/Cargo.toml
      prefix: "klyn-fuzz-nightly-0.13.2"
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/bin/cargo-fuzz
      - crates/klyn-sandbox/fuzz/target/
    policy: pull-push
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
    - |
      installed_version="$(cargo-fuzz --version 2>/dev/null || true)"
      if [[ "$installed_version" == "cargo-fuzz 0.13.2" ]]; then
        echo "Using cached cargo-fuzz 0.13.2"
      else
        cargo +nightly install cargo-fuzz --version 0.13.2 --locked --force
      fi
    - cargo +nightly metadata --locked --format-version 1 --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml > /dev/null
    - cargo +nightly fmt --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml -- --check
    - cargo +nightly clippy --locked --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml --all-targets -- -D warnings
    - |
      cd crates/klyn-sandbox/fuzz
      cargo +nightly fuzz build fuzz_ipc_frame
      cargo +nightly fuzz build fuzz_kel_parser
      git -C "$CI_PROJECT_DIR" diff --exit-code -- crates/klyn-sandbox/fuzz/Cargo.lock


fuzz_campaign:
  stage: fuzz
  timeout: 45m
  variables:
    RUSTUP_TOOLCHAIN: "nightly"
    KLYN_FUZZ_RUNS: "1000000"
  cache:
    key:
      files:
        - crates/klyn-sandbox/fuzz/Cargo.lock
        - crates/klyn-sandbox/fuzz/Cargo.toml
      prefix: "klyn-fuzz-nightly-0.13.2"
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/bin/cargo-fuzz
      - crates/klyn-sandbox/fuzz/target/
    policy: pull
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
    - |
      installed_version="$(cargo-fuzz --version 2>/dev/null || true)"
      if [[ "$installed_version" == "cargo-fuzz 0.13.2" ]]; then
        echo "Using cached cargo-fuzz 0.13.2"
      else
        cargo +nightly install cargo-fuzz --version 0.13.2 --locked --force
      fi
    - cargo +nightly metadata --locked --format-version 1 --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml > /dev/null
    - bash scripts/run_fuzz_campaign.sh
    - git diff --exit-code -- crates/klyn-sandbox/fuzz/Cargo.lock
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "feat/phase2-step5-fuzz-native-qualification"'
      when: on_success
    - when: never

native_linux_qualification:
  stage: qualification
  tags:
    - klyn-native-qualification
  timeout: 45m
  variables:
    KLYN_REQUIRE_NATIVE_LINUX_QUALIFICATION: "1"
    KLYN_NATIVE_EVIDENCE_ROOT: "$CI_PROJECT_DIR/target/native-qualification-evidence"
  script:
    - mkdir -p "$CI_PROJECT_DIR/target/native-qualification-evidence"
    - bash scripts/orchestrate_native_qualification.sh
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - target/native-qualification-evidence/
  rules:
    - if: '$KLYN_NATIVE_QUALIFICATION_READY == "true" && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "feat/phase2-step5-fuzz-native-qualification")'
      when: manual
    - when: never

native_qualification_status:
  stage: qualification
  before_script: []
  script:
    - |
      if [[ "${KLYN_NATIVE_QUALIFICATION_READY:-false}" == "true" ]]; then
        echo "Native qualification runner is declared ready; execute the blocking manual native_linux_qualification job."
        echo "This status job alone does not certify the native runtime."
      else
        echo "NATIVE QUALIFICATION: NOT RUN."
        echo "KLYN_NATIVE_QUALIFICATION_READY is not true; the dedicated runner/trusted assets are not declared provisioned."
        echo "A green standard pipeline is not native Linux runtime certification."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "feat/phase2-step5-fuzz-native-qualification"'
      when: on_success
    - when: never

image: rust:1.99.0-bookworm

stages:
  - validate
  - test

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"

cache:
  key:
    files:
      - Cargo.lock
    prefix: "klyn-rust-1.99.0"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - target/

before_script:
  - git --version
  - rustup component add rustfmt clippy
  - rustc --version
  - cargo --version
  - uname -a

validate_sandbox:
  stage: validate
  script:
    - cargo fmt --all -- --check
    - cargo metadata --locked --format-version 1 > /dev/null
    - RUSTFLAGS="-D warnings" cargo check --locked --workspace --all-targets

test_sandbox:
  stage: test
  script:
    - cargo test --locked --workspace -- --nocapture
    - cargo clippy --locked --workspace --all-targets -- -D warnings
fuzz_targets:
  stage: test
  timeout: 20m
  cache:
    key:
      files:
        - Cargo.lock
        - crates/klyn-sandbox/fuzz/Cargo.toml
      prefix: "klyn-fuzz-nightly-0.13.2"
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/bin/cargo-fuzz
      - crates/klyn-sandbox/fuzz/target/
    policy: pull-push
  script:
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
    - |
      installed_version="$(cargo-fuzz --version 2>/dev/null || true)"
      if [[ "$installed_version" == "cargo-fuzz 0.13.2" ]]; then
        echo "Using cached cargo-fuzz 0.13.2"
      else
        cargo +nightly install cargo-fuzz --version 0.13.2 --locked --force
      fi
    - cargo +nightly fmt --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml -- --check
    - cargo +nightly clippy --manifest-path crates/klyn-sandbox/fuzz/Cargo.toml --all-targets -- -D warnings
    - cd crates/klyn-sandbox/fuzz && cargo +nightly fuzz build fuzz_ipc_frame && cargo +nightly fuzz build fuzz_kel_parser

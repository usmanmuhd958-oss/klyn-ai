image: node:22

stages:
  - verify
  - audit

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

before_script:
  - corepack enable
  - corepack prepare pnpm@11.24.0 --activate
  - pnpm --version

workspace_verify:
  stage: verify
  script:
    - set -eu
    - test -f pnpm-workspace.yaml
    - test -f pnpm-lock.yaml
    - test -f turbo.json
    - test -f apps/backend/package.json
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm build
    - pnpm test

code_audit:
  stage: audit
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends shellcheck
  script:
    - bash scripts/ai_code_review.sh

default:
  image: node:20-slim

stages:
  - validate
  - build

validate_klyn:
  stage: validate
  script:
    - echo "⚡ Validating Klyn OS Agentic Core..."
    - node -v
    - echo "✓ Core validation successful!"

build_klyn:
  stage: build
  script:
    - echo "🚀 Executing Klyn build process..."
    - echo "✓ Klyn build successfully completed!"

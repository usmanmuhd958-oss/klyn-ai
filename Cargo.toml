[package]
name = "klyn-kernel-core"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.11.0"
libc = "0.2.189"
napi = { version = "2.16", default-features = false, features = ["napi9"] }
napi-derive = "2.16"
zeroize = "1.9.0"

[build-dependencies]
napi-build = "2.1"
cc = "1.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

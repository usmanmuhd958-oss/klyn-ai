# KLYN OS backend/infrastructure workspace.
# Frontend/UI applications remain intentionally excluded from the backend control plane.
packages:
  - "apps/backend"
  - "packages/agent-governance"
  - "packages/ai-engine"
  - "packages/autonomy"
  - "packages/cognitive-engine"
  - "packages/database"
  - "packages/evolution-controller"
  - "packages/execution-runtime"
  - "packages/governance"
  - "packages/mission-engine"
  - "packages/runtime"
  - "packages/self-healing-runtime"
  - "packages/swarm-mesh"
  - "packages/tsconfig"
  - "packages/workflow-engine"

# pnpm v11: unknown dependency build scripts fail closed.
strictDepBuilds: true

# Keep package engine ranges aligned with the supported Node.js baseline.
engineStrict: true

# Explicit lifecycle approvals only. esbuild is used by tsx in workspace scripts.
allowBuilds:
  esbuild: true

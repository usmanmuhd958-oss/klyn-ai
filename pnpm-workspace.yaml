# KLYN backend/infrastructure workspace.
# Frontend/UI applications remain intentionally excluded from the backend control plane.
packages:
  - "apps/backend"
  - "packages/agent-runtime"
  - "packages/ai-engine"
  - "packages/ai-gateway"
  - "packages/ai-orchestrator"
  - "packages/autonomous-runtime"
  - "packages/cognitive-engine"
  - "packages/control-plane"
  - "packages/core-runtime"
  - "packages/database"
  - "packages/deploy"
  - "packages/evolution-controller"
  - "packages/execution-runtime"
  - "packages/governance"
  - "packages/intelligence"
  - "packages/mission-engine"
  - "packages/runtime"
  - "packages/self-healing-runtime"
  - "packages/swarm-mesh"
  - "packages/tsconfig"
  - "packages/workflow-engine"

allowBuilds:
  esbuild: true
  sharp: true

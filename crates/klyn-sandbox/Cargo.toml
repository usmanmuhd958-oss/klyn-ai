[package]
name = "klyn-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Kernel-enforced execution isolation and capability-scoped resource broker for KLYN OS"

[dependencies]
crossbeam-channel = "0.5"
ed25519-dalek = "2.2"
landlock = "0.4.7"
libc = "0.2"
nix = { version = "0.30", features = ["socket", "uio", "fs", "mount", "sched"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seccompiler = "0.5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

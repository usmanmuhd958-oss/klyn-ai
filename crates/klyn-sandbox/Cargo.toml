[package]
name = "klyn-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Kernel-enforced execution isolation and capability-scoped resource broker for KLYN OS"

[dependencies]
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
crossbeam-channel = "0.5"
landlock = "0.4.7"
libc = "0.2"
nix = { version = "0.30", features = ["socket", "uio"] }
seccompiler = "0.5"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[package]
name = "klyn-sandbox"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
klyn-evidence = { path = "../klyn-evidence" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

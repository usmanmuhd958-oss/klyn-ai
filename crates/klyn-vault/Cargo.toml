[package]
name = "klyn-vault"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "error_anyhow"] }
napi-derive = "2.16"
serde = { version = "1.0.229", features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", features = ["alloc"] }
parking_lot = "0.12"
ahash = "0.8"
libc = "0.2"

[build-dependencies]
cc = "1"
napi-build = "2"

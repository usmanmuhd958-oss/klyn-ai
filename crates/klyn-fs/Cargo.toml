[package]
name = "klyn-fs"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
publish = false
description = "Revision-bound candidate workspaces and crash-recoverable Git-ref CAS publication for KLYN OS"

[dependencies]
nix = { version = "0.30", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package]
name = "klyn_kernel_core"
version = "3.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["napi"]
napi = []

[dependencies]
napi = { version = "2.16.12", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2.16.11"
bytes = "1.5.0"
dashmap = "5.5.3"
parking_lot = "0.12.1"
smallvec = "1.11.0"
aes-gcm = "0.10.3"
rand = "0.8.5"
thiserror = "1.0.56"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
